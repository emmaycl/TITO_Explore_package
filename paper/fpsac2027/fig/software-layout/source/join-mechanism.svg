<svg xmlns="http://www.w3.org/2000/svg" width="624" height="169" viewBox="0 0 624 169" role="img" aria-label="A cycle explains the reconstructed join"><style>@font-face{font-family:FigureSans;src:url('../fonts/FigureSans.ttf')}text{font-family:FigureSans,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="6" markerHeight="5" orient="auto"><path d="M0,0L8,3L0,6Z" fill="context-stroke"></path></marker></defs><rect data-box="cycle" x="8" y="8" width="260" height="153" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.05"></rect><rect data-box="result" x="356" y="8" width="260" height="153" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.05"></rect><text x="138" y="29" text-anchor="middle" font-size="14" fill="#000000" class="">A period-6 cycle</text><text x="486" y="29" text-anchor="middle" font-size="14" fill="#000000" class="">Reconstructed join</text><rect data-box="r2" x="58" y="49" width="20" height="22" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.05"></rect><text x="68" y="65" text-anchor="middle" font-size="16" fill="#000000" class="">2</text><rect data-box="r3" x="198" y="49" width="20" height="22" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.05"></rect><text x="208" y="65" text-anchor="middle" font-size="16" fill="#000000" class="">3</text><rect data-box="r4" x="128" y="108" width="20" height="22" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.05"></rect><text x="138" y="124" text-anchor="middle" font-size="16" fill="#000000" class="">4</text><path d="M78,60L198,60" fill="none" stroke="#0000ff" stroke-width="1.15" marker-end="url(#arrow)"></path><text x="138" y="51" text-anchor="middle" font-size="14" fill="#0000ff" class="">1 (A)</text><path d="M208,71L148,119" fill="none" stroke="#e60000" stroke-width="1.15" marker-end="url(#arrow)"></path><text x="224" y="104" text-anchor="middle" font-size="14" fill="#e60000" class="">1* (B)</text><path d="M128,119L68,71" fill="none" stroke="#0000ff" stroke-width="1.15" marker-end="url(#arrow)"></path><text x="49" y="104" text-anchor="middle" font-size="14" fill="#0000ff" class="">4* (A)</text><text x="138" y="150" text-anchor="middle" font-size="16" fill="#000000" class="">1 + 1 + 4 = 6</text><path d="M268,84.5L356,84.5" fill="none" stroke="#000000" stroke-width="1.15" marker-end="url(#arrow)"></path><text x="312" y="72" text-anchor="middle" font-size="14" fill="#000000" class="">decode</text><text x="486" y="53" text-anchor="middle" font-size="17" fill="#000000" class="">A ∨ B =</text><g data-window-row="true" data-center="486" data-gap="14"><g data-window-item="true"><text x="401.625" y="83" text-anchor="middle" font-size="16" fill="#000000" class="math"><tspan data-waning="0">[0, 13]</tspan></text><text x="401.625" y="107" text-anchor="middle" font-size="14" fill="#000000" class="">waxing</text></g><g data-window-item="true"><text x="487.3203125" y="83" text-anchor="middle" font-size="16" fill="#000000" class="math"><tspan data-waning="1">[2, −2, −3]</tspan></text><text x="487.3203125" y="107" text-anchor="middle" font-size="14" fill="#000000" class="">waning</text></g><g data-window-item="true"><text x="571.6953125" y="83" text-anchor="middle" font-size="16" fill="#000000" class="math"><tspan data-waning="1">[5]</tspan></text><text x="571.6953125" y="107" text-anchor="middle" font-size="14" fill="#000000" class="">waning</text></g></g><text x="486" y="131" text-anchor="middle" font-size="14" fill="#000000" class="">Residues {2,3,4} merge.</text><text x="486" y="151" text-anchor="middle" font-size="14" fill="#000000" class="">Other blocks remain unchanged.</text><line x1="442.2265625" x2="532.4140625" y1="89" y2="89" stroke="rgb(0, 0, 0)" stroke-width="1.1" data-underline="true"></line><line x1="560.359375" x2="583.03125" y1="89" y2="89" stroke="rgb(0, 0, 0)" stroke-width="1.1" data-underline="true"></line></svg>