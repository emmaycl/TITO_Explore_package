[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TITO_Explore"
version = "0.1.1"
description = "Finite representations, comparison and joins of translation-invariant total orders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
